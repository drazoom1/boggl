<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Bboggl · 점검 중</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root{
    --bg:#faf9f6; --panel:#ffffff; --ink:#1c1c1e; --ink-2:#4a4a4f; --muted:#8e8e93; --line:#e6e6e8; --black:#161618;
    --sans:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.6;
    -webkit-font-smoothing:antialiased;word-break:keep-all;
    display:grid;place-items:center;padding:28px}
  .card{max-width:460px;width:100%;text-align:center}
  .logo{font-family:"Archivo Black",var(--sans);font-size:30px;font-style:italic;letter-spacing:-1px;color:var(--black);margin-bottom:30px}
  .pot{width:72px;height:72px;border-radius:50%;background:var(--panel);border:1px solid var(--line);
    display:grid;place-items:center;margin:0 auto 22px;box-shadow:0 8px 24px rgba(20,20,22,.05)}
  .pot svg{width:38px;height:38px;fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  h1{font-size:23px;font-weight:800;letter-spacing:-.5px;margin-bottom:12px}
  p{color:var(--ink-2);font-size:15px}
  .sub{color:var(--muted);font-size:13.5px;margin-top:18px}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">BBOGGL</div>
    <div class="pot">
      <svg viewBox="0 0 24 24"><path d="M4 10h16"/><path d="M5 10v5a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-5"/><path d="M4 10H2.4M20 10h1.6"/><path d="M9 3.4c-.6 1 .6 1.6 0 2.6M12 3c-.6 1 .6 1.6 0 2.6M15 3.4c-.6 1 .6 1.6 0 2.6"/></svg>
    </div>
    <h1>잠시 점검 중이에요</h1>
    <p>더 나은 서비스를 위해 잠깐 문을 닫고 손보는 중이에요.<br>조금 뒤에 다시 찾아주세요. 🍲</p>
    <div class="sub">이용에 불편을 드려 죄송합니다 · Bboggl 드림</div>
  </div>
</body>
</html>
